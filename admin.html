<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sravan's Workspace Dashboard</title>
    <style>
        /* ==============================================
           CORE DESIGN SYSTEM & VARIABLES
           ============================================== */
        :root {
            /* Strictly Maintained Color Palette */
            --bg-base: #0a0a0a;
            --surface: rgba(20, 20, 20, 0.8);
            --surface-elevated: #18181b;
            --surface-border: rgba(255, 255, 255, 0.08);
            --surface-border-strong: #27272a;
            --text-primary: #f2f2f2;
            --text-secondary: #a0a0a0;
            --text-muted: #666666;
            
            --accent: #c9a86a;
            --accent-hover: #e0c897;
            
            --danger: #e74c3c;
            --danger-bg: rgba(231, 76, 60, 0.1);
            --success: #58d68d;
            --success-bg: rgba(88, 214, 141, 0.1);
            --info: #5dade2;
            --info-bg: rgba(93, 173, 226, 0.1);
            --warning: #f0d9a0;
            --warning-bg: rgba(240, 217, 160, 0.1);
            
            --font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif;
            --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-primary);
            font-family: var(--font-family);
            margin: 0;
            padding: 40px 20px;
            min-height: 100vh;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(201, 168, 106, 0.03), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(255, 255, 255, 0.02), transparent 25%);
        }

        /* Layout */
        .admin-container {
            max-width: 1400px;
            margin: 0 auto;
            background: var(--surface);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--surface-border);
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            display: none; 
            animation: fadeIn 0.4s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ==============================================
           HEADER & NAVIGATION (Upgraded)
           ============================================== */
        .workspace-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 35px;
            padding-bottom: 25px;
            border-bottom: 1px solid var(--surface-border-strong);
        }

        .header-eyebrow {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--accent);
            margin-bottom: 8px;
            display: block;
        }

        .header-title {
            font-size: 32px;
            font-weight: 700;
            color: #fff;
            margin: 0;
            letter-spacing: -0.5px;
        }

        /* Pill Tab Navigation */
        .pill-tabs {
            display: inline-flex;
            background: var(--bg-base);
            border: 1px solid var(--surface-border-strong);
            border-radius: 12px;
            padding: 6px;
            gap: 6px;
            margin-bottom: 30px;
        }

        .pill-tab {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            padding: 10px 20px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            border-radius: 8px;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .pill-tab:hover {
            color: var(--text-primary);
            background: rgba(255, 255, 255, 0.03);
        }

        .pill-tab.active {
            background: var(--surface-border-strong);
            color: #fff;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }

        .tab-counter {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--surface-border);
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 11px;
            color: var(--text-secondary);
            transition: var(--transition);
        }

        .pill-tab.active .tab-counter {
            background: var(--accent);
            color: #000;
            border-color: var(--accent);
        }

        .tab-pane {
            display: none;
            animation: fadeIn 0.3s ease forwards;
        }
        .tab-pane.active { display: block; }

        /* ==============================================
           INPUTS & COMMAND BARS (Upgraded)
           ============================================== */
        .command-bar {
            background: var(--surface-elevated);
            border: 1px solid var(--surface-border-strong);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 30px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            display: flex;
            gap: 16px;
            align-items: flex-end;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex: 1;
        }

        .input-label {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .modern-input {
            background: #0a0a0a;
            border: 1px solid var(--surface-border-strong);
            color: #fff;
            border-radius: 8px;
            padding: 12px 16px;
            font-size: 13px;
            transition: var(--transition);
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
            width: 100%;
            box-sizing: border-box;
        }

        .modern-input::placeholder { color: #52525b; }
        
        .modern-input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.2), 0 0 0 3px rgba(201, 168, 106, 0.15);
        }

        .modern-select {
            appearance: none;
            background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20width%3D%2212%22%20height%3D%2212%22%20viewBox%3D%220%200%2024%2024%22%20fill%3D%22none%22%20stroke%3D%22%23a0a0a0%22%20stroke-width%3D%222%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpolyline%20points%3D%226%209%2012%2015%2018%209%22%3E%3C%2Fpolyline%3E%3C%2Fsvg%3E");
            background-repeat: no-repeat;
            background-position: right 14px center;
            padding-right: 36px;
        }

        .btn {
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: var(--transition);
            border: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary {
            background: var(--accent);
            color: #000;
            height: 43px;
        }
        
        .btn-primary:hover {
            background: var(--accent-hover);
            transform: scale(1.02);
            box-shadow: 0 4px 12px rgba(201, 168, 106, 0.2);
        }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--surface-border-strong);
            color: var(--text-primary);
        }

        .btn-outline:hover {
            background: rgba(255,255,255,0.05);
        }

        /* ==============================================
           KANBAN BOARDS (Upgraded)
           ============================================== */
        .kanban-board {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 24px;
        }

        .kanban-col {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .kanban-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 12px;
            border-bottom: 2px solid;
            margin-bottom: 8px;
        }

        .kanban-title {
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .kanban-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        .col-applied { border-color: var(--warning-bg); }
        .col-applied .kanban-title { color: var(--warning); }
        .col-applied .kanban-dot { background: var(--warning); box-shadow: 0 0 8px var(--warning-bg); }

        .col-interviewing { border-color: var(--info-bg); }
        .col-interviewing .kanban-title { color: var(--info); }
        .col-interviewing .kanban-dot { background: var(--info); box-shadow: 0 0 8px var(--info-bg); }

        .col-offered { border-color: var(--success-bg); }
        .col-offered .kanban-title { color: var(--success); }
        .col-offered .kanban-dot { background: var(--success); box-shadow: 0 0 8px var(--success-bg); }

        .col-rejected { border-color: var(--danger-bg); }
        .col-rejected .kanban-title { color: var(--danger); }
        .col-rejected .kanban-dot { background: var(--danger); box-shadow: 0 0 8px var(--danger-bg); }

        .card-container {
            min-height: 400px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            border-radius: 12px;
            transition: var(--transition);
        }

        .card-container.drag-over {
            background: rgba(255, 255, 255, 0.02);
            box-shadow: inset 0 0 0 2px var(--surface-border-strong);
        }

        .empty-drop-zone {
            height: 100px;
            border: 2px dashed var(--surface-border-strong);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            pointer-events: none;
        }

        /* Executive Kanban Cards */
        .exec-card {
            background: var(--surface-elevated);
            border: 1px solid var(--surface-border-strong);
            border-radius: 12px;
            padding: 16px;
            cursor: grab;
            transition: var(--transition);
            position: relative;
        }

        .exec-card:hover {
            border-color: #3f3f46;
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }

        .exec-card:active { cursor: grabbing; }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
        }

        .card-brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-avatar {
            width: 32px;
            height: 32px;
            background: var(--bg-base);
            border: 1px solid var(--surface-border-strong);
            border-radius: 8px;
            display: grid;
            place-items: center;
            font-weight: 700;
            font-size: 14px;
            color: var(--text-primary);
        }

        .card-titles h4 {
            margin: 0 0 4px 0;
            font-size: 14px;
            color: #fff;
            font-weight: 600;
        }

        .card-titles p {
            margin: 0;
            font-size: 12px;
            color: var(--text-secondary);
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 12px;
            border-top: 1px solid var(--surface-border-strong);
        }

        .micro-badge {
            background: rgba(255,255,255,0.05);
            color: var(--accent);
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
            border: 1px solid rgba(255,255,255,0.02);
        }

        .card-date {
            font-size: 11px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .btn-icon {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 4px;
            border-radius: 4px;
            transition: var(--transition);
            display: grid;
            place-items: center;
        }

        .btn-icon:hover {
            color: var(--danger);
            background: var(--danger-bg);
        }

        /* ==============================================
           PROJECTS & TASKS SPLIT GRID
           ============================================== */
        .split-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }

        .section-header {
            font-size: 16px;
            font-weight: 600;
            color: #fff;
            margin: 0 0 20px 0;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* Project Cards */
        .project-card {
            background: var(--surface-elevated);
            border: 1px solid var(--surface-border-strong);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 16px;
            transition: var(--transition);
        }

        .project-card:hover {
            border-color: #3f3f46;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }

        .project-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 16px;
        }

        .project-title { font-size: 15px; font-weight: 600; color: #fff; margin: 0 0 4px 0;}
        .project-meta { font-size: 11px; color: var(--text-muted); }

        .status-pill {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            padding: 4px 10px;
            border-radius: 12px;
            letter-spacing: 0.5px;
        }
        
        .status-pill.planning { background: var(--warning-bg); color: var(--warning); border: 1px solid rgba(240, 217, 160, 0.2); }
        .status-pill.development { background: var(--info-bg); color: var(--info); border: 1px solid rgba(93, 173, 226, 0.2); }
        .status-pill.live { background: var(--success-bg); color: var(--success); border: 1px solid rgba(88, 214, 141, 0.2); }

        .tech-stack-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            padding-top: 16px;
            border-top: 1px solid var(--surface-border-strong);
            align-items: center;
            justify-content: space-between;
        }

        .stack-tags { display: flex; gap: 6px; flex-wrap: wrap; }
        
        .stack-tag {
            background: var(--surface-border-strong);
            color: var(--text-secondary);
            font-size: 11px;
            padding: 3px 8px;
            border-radius: 6px;
            border: 1px solid #3f3f46;
        }

        /* Task Checklist Rows */
        .task-row {
            background: var(--surface-elevated);
            border: 1px solid var(--surface-border-strong);
            border-radius: 10px;
            padding: 14px 16px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: var(--transition);
        }

        .task-row:hover { background: #1f1f22; border-color: #3f3f46; }

        .task-left { display: flex; align-items: center; gap: 16px; flex: 1; }

        .custom-check {
            width: 18px;
            height: 18px;
            border-radius: 5px;
            border: 1.5px solid #52525b;
            cursor: pointer;
            display: grid;
            place-items: center;
            transition: var(--transition);
            flex-shrink: 0;
        }
        .custom-check.checked { background: var(--accent); border-color: var(--accent); }
        .custom-check.checked::after {
            content: ''; width: 4px; height: 8px; border: solid #000; border-width: 0 2px 2px 0; transform: rotate(45deg); margin-bottom: 2px;
        }

        .task-details { display: flex; flex-direction: column; gap: 4px; }
        .task-name { font-size: 13px; color: #fff; transition: var(--transition); }
        .task-name.checked { text-decoration: line-through; color: var(--text-muted); }

        .task-meta-chips {
            display: flex;
            gap: 12px;
            font-size: 11px;
            color: var(--text-secondary);
            align-items: center;
        }

        .chip { display: flex; align-items: center; gap: 5px; }
        
        .pri-dot { width: 6px; height: 6px; border-radius: 50%; }
        .pri-high { background: var(--danger); box-shadow: 0 0 6px var(--danger-bg); }
        .pri-medium { background: #f97316; }
        .pri-low { background: #71717a; }

        /* Auth Screen */
        .auth-card {
            max-width: 400px;
            margin: 10vh auto;
            background: var(--surface-elevated);
            backdrop-filter: blur(20px);
            border: 1px solid var(--surface-border-strong);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }
    </style>
</head>
<body>

    <!-- AUTHENTICATION -->
    <div id="auth-view" class="auth-card">
        <span class="header-eyebrow">System Access</span>
        <h2 class="header-title" style="margin-bottom: 25px;">Admin Portal</h2>
        <form id="login-form">
            <div class="input-group" style="margin-bottom: 20px;">
                <label class="input-label">Username</label>
                <input type="text" id="username" class="modern-input" required>
            </div>
            <div class="input-group" style="margin-bottom: 25px;">
                <label class="input-label">Password</label>
                <input type="password" id="password" class="modern-input" required>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%;">Authenticate</button>
            <p id="login-error" style="color: var(--danger); font-size: 12px; display: none; margin-top: 15px;">Invalid credentials.</p>
        </form>
    </div>

    <!-- MAIN DASHBOARD -->
    <div id="dashboard-view" class="admin-container">
        
        <!-- HEADER -->
        <header class="workspace-header">
            <div>
                <span class="header-eyebrow">Executive Dashboard</span>
                <h1 class="header-title">Sravan's Workspace Pipeline</h1>
            </div>
            <button id="logout-btn" class="btn btn-outline">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                Sign Out
            </button>
        </header>

        <!-- PILL NAVIGATION -->
        <nav class="pill-tabs">
            <button class="pill-tab active" data-tab="pane-jobs">
                Job Pipeline <span class="tab-counter" id="count-nav-jobs">0</span>
            </button>
            <button class="pill-tab" data-tab="pane-interns">
                Internship Pipeline <span class="tab-counter" id="count-nav-interns">0</span>
            </button>
            <button class="pill-tab" data-tab="pane-projects">
                Projects & Tasks <span class="tab-counter" id="count-nav-projects">0</span>
            </button>
        </nav>

        <!-- ============================================== -->
        <!-- PANE 1: JOB PIPELINE                           -->
        <!-- ============================================== -->
        <main id="pane-jobs" class="tab-pane active">
            <!-- Form Command Bar -->
            <form id="form-jobs" class="command-bar">
                <div class="input-group">
                    <label class="input-label">Company</label>
                    <input type="text" id="job-company" class="modern-input" placeholder="e.g. Tesla, Microsoft" required>
                </div>
                <div class="input-group">
                    <label class="input-label">Role</label>
                    <input type="text" id="job-role" class="modern-input" placeholder="e.g. Python Engineer" required>
                </div>
                <div class="input-group">
                    <label class="input-label">Package (CTC)</label>
                    <input type="text" id="job-package" class="modern-input" placeholder="e.g. 15 LPA">
                </div>
                <button type="submit" class="btn btn-primary">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                    Add Job
                </button>
            </form>

            <!-- Kanban Board -->
            <div class="kanban-board">
                <div class="kanban-col col-applied">
                    <div class="kanban-header">
                        <div class="kanban-title"><div class="kanban-dot"></div> Applied</div>
                        <span class="tab-counter" id="job-badge-Applied">0</span>
                    </div>
                    <div class="card-container" data-status="Applied" data-type="job"></div>
                </div>
                <div class="kanban-col col-interviewing">
                    <div class="kanban-header">
                        <div class="kanban-title"><div class="kanban-dot"></div> Interviewing</div>
                        <span class="tab-counter" id="job-badge-Interviewing">0</span>
                    </div>
                    <div class="card-container" data-status="Interviewing" data-type="job"></div>
                </div>
                <div class="kanban-col col-offered">
                    <div class="kanban-header">
                        <div class="kanban-title"><div class="kanban-dot"></div> Offered</div>
                        <span class="tab-counter" id="job-badge-Offered">0</span>
                    </div>
                    <div class="card-container" data-status="Offered" data-type="job"></div>
                </div>
                <div class="kanban-col col-rejected">
                    <div class="kanban-header">
                        <div class="kanban-title"><div class="kanban-dot"></div> Rejected</div>
                        <span class="tab-counter" id="job-badge-Rejected">0</span>
                    </div>
                    <div class="card-container" data-status="Rejected" data-type="job"></div>
                </div>
            </div>
        </main>

        <!-- ============================================== -->
        <!-- PANE 2: INTERNSHIP PIPELINE                    -->
        <!-- ============================================== -->
        <main id="pane-interns" class="tab-pane">
            <!-- Form Command Bar -->
            <form id="form-interns" class="command-bar">
                <div class="input-group">
                    <label class="input-label">Company</label>
                    <input type="text" id="int-company" class="modern-input" placeholder="e.g. OpenAI, Google" required>
                </div>
                <div class="input-group">
                    <label class="input-label">Role</label>
                    <input type="text" id="int-role" class="modern-input" placeholder="e.g. ML Intern" required>
                </div>
                <div class="input-group">
                    <label class="input-label">Stipend</label>
                    <input type="text" id="int-package" class="modern-input" placeholder="e.g. 50k/mo">
                </div>
                <button type="submit" class="btn btn-primary">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                    Add Intern
                </button>
            </form>

            <!-- Kanban Board -->
            <div class="kanban-board">
                <div class="kanban-col col-applied">
                    <div class="kanban-header">
                        <div class="kanban-title"><div class="kanban-dot"></div> Applied</div>
                        <span class="tab-counter" id="intern-badge-Applied">0</span>
                    </div>
                    <div class="card-container" data-status="Applied" data-type="intern"></div>
                </div>
                <div class="kanban-col col-interviewing">
                    <div class="kanban-header">
                        <div class="kanban-title"><div class="kanban-dot"></div> Interviewing</div>
                        <span class="tab-counter" id="intern-badge-Interviewing">0</span>
                    </div>
                    <div class="card-container" data-status="Interviewing" data-type="intern"></div>
                </div>
                <div class="kanban-col col-offered">
                    <div class="kanban-header">
                        <div class="kanban-title"><div class="kanban-dot"></div> Offered</div>
                        <span class="tab-counter" id="intern-badge-Offered">0</span>
                    </div>
                    <div class="card-container" data-status="Offered" data-type="intern"></div>
                </div>
                <div class="kanban-col col-rejected">
                    <div class="kanban-header">
                        <div class="kanban-title"><div class="kanban-dot"></div> Rejected</div>
                        <span class="tab-counter" id="intern-badge-Rejected">0</span>
                    </div>
                    <div class="card-container" data-status="Rejected" data-type="intern"></div>
                </div>
            </div>
        </main>

        <!-- ============================================== -->
        <!-- PANE 3: PROJECTS & TASKS                       -->
        <!-- ============================================== -->
        <main id="pane-projects" class="tab-pane">
            <div class="split-grid">
                
                <!-- Left: Active Projects -->
                <section>
                    <h3 class="section-header">Active Projects <span class="tab-counter" id="count-title-projects">0</span></h3>
                    
                    <form id="form-projects" class="command-bar" style="flex-wrap: wrap;">
                        <div class="input-group" style="min-width: 45%;">
                            <label class="input-label">Project Name</label>
                            <input type="text" id="proj-name" class="modern-input" placeholder="e.g. CodeRefine, Zyra" required>
                        </div>
                        <div class="input-group" style="min-width: 25%;">
                            <label class="input-label">Status</label>
                            <select id="proj-status" class="modern-input modern-select">
                                <option value="planning">Planning</option>
                                <option value="development">Development</option>
                                <option value="live">Live / Complete</option>
                            </select>
                        </div>
                        <div class="input-group" style="width: 100%;">
                            <label class="input-label">Tech Stack</label>
                            <div style="display: flex; gap: 12px;">
                                <input type="text" id="proj-stack" class="modern-input" placeholder="e.g. Flask, Python, Vanilla JS" required>
                                <button type="submit" class="btn btn-primary" style="white-space: nowrap;">Create Project</button>
                            </div>
                        </div>
                    </form>

                    <div id="projects-list"></div>
                </section>

                <!-- Right: Actionable Tasks -->
                <section>
                    <h3 class="section-header">Actionable Tasks <span class="tab-counter" id="count-title-tasks">0 Remaining</span></h3>
                    
                    <form id="form-tasks" class="command-bar" style="flex-wrap: wrap;">
                        <div class="input-group" style="width: 100%;">
                            <label class="input-label">Task Description</label>
                            <input type="text" id="task-name" class="modern-input" placeholder="What needs to be done?" required>
                        </div>
                        <div class="input-group" style="min-width: 35%;">
                            <label class="input-label">Target Date</label>
                            <input type="date" id="task-deadline" class="modern-input">
                        </div>
                        <div class="input-group" style="min-width: 30%;">
                            <label class="input-label">Priority</label>
                            <select id="task-priority" class="modern-input modern-select">
                                <option value="high">High</option>
                                <option value="medium" selected>Medium</option>
                                <option value="low">Low</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-primary" style="flex: 1;">Log</button>
                    </form>

                    <div id="tasks-list"></div>
                </section>

            </div>
        </main>
    </div>

    <!-- ==============================================
         VANILLA JAVASCRIPT ENGINE
         ============================================== -->
    <script>
        const KEYS = {
            jobs: 'workspace-exec-jobs',
            interns: 'workspace-exec-interns',
            projects: 'workspace-exec-projects',
            tasks: 'workspace-exec-tasks'
        };

        let dragSrcId = null;
        let dragType = null;

        document.addEventListener('DOMContentLoaded', () => {
            initAuth();
            initTabs();
            initForms();
            initDragAndDrop();
            renderDashboard();
        });

        // 1. Authentication
        function initAuth() {
            if(sessionStorage.getItem('exec-auth') === 'true') {
                document.getElementById('auth-view').style.display = 'none';
                document.getElementById('dashboard-view').style.display = 'block';
            }
            
            document.getElementById('login-form').addEventListener('submit', (e) => {
                e.preventDefault();
                if(document.getElementById('username').value === 'sravan' && document.getElementById('password').value === 'sravan123') {
                    sessionStorage.setItem('exec-auth', 'true');
                    location.reload();
                } else {
                    document.getElementById('login-error').style.display = 'block';
                }
            });

            document.getElementById('logout-btn').addEventListener('click', () => {
                sessionStorage.removeItem('exec-auth');
                location.reload();
            });
        }

        // 2. Tab Navigation
        function initTabs() {
            const tabs = document.querySelectorAll('.pill-tab');
            const panes = document.querySelectorAll('.tab-pane');

            tabs.forEach(tab => {
                tab.addEventListener('click', () => {
                    tabs.forEach(t => t.classList.remove('active'));
                    panes.forEach(p => p.classList.remove('active'));
                    
                    tab.classList.add('active');
                    document.getElementById(tab.getAttribute('data-tab')).classList.add('active');
                });
            });
        }

        // 3. Form Submissions
        function initForms() {
            const getTodayDate = () => new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric' });

            // Jobs
            document.getElementById('form-jobs').addEventListener('submit', (e) => {
                e.preventDefault();
                const data = getLocal(KEYS.jobs);
                data.push({
                    id: Date.now(),
                    company: document.getElementById('job-company').value,
                    role: document.getElementById('job-role').value,
                    package: document.getElementById('job-package').value || 'N/A',
                    date: getTodayDate(),
                    status: 'Applied'
                });
                setLocal(KEYS.jobs, data);
                e.target.reset();
                renderDashboard();
            });

            // Internships
            document.getElementById('form-interns').addEventListener('submit', (e) => {
                e.preventDefault();
                const data = getLocal(KEYS.interns);
                data.push({
                    id: Date.now(),
                    company: document.getElementById('int-company').value,
                    role: document.getElementById('int-role').value,
                    package: document.getElementById('int-package').value || 'N/A',
                    date: getTodayDate(),
                    status: 'Applied'
                });
                setLocal(KEYS.interns, data);
                e.target.reset();
                renderDashboard();
            });

            // Projects
            document.getElementById('form-projects').addEventListener('submit', (e) => {
                e.preventDefault();
                const data = getLocal(KEYS.projects);
                data.push({
                    id: Date.now(),
                    name: document.getElementById('proj-name').value,
                    stack: document.getElementById('proj-stack').value,
                    status: document.getElementById('proj-status').value,
                    updated: getTodayDate()
                });
                setLocal(KEYS.projects, data);
                e.target.reset();
                renderDashboard();
            });

            // Tasks
            document.getElementById('form-tasks').addEventListener('submit', (e) => {
                e.preventDefault();
                const data = getLocal(KEYS.tasks);
                const rawDate = document.getElementById('task-deadline').value;
                const deadline = rawDate ? new Date(rawDate).toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) : 'No Target Date';
                
                data.push({
                    id: Date.now(),
                    name: document.getElementById('task-name').value,
                    priority: document.getElementById('task-priority').value,
                    deadline: deadline,
                    checked: false
                });
                setLocal(KEYS.tasks, data);
                e.target.reset();
                document.getElementById('task-priority').value = 'medium';
                renderDashboard();
            });
        }

        // 4. Native Drag & Drop
        function initDragAndDrop() {
            const containers = document.querySelectorAll('.card-container');
            
            containers.forEach(container => {
                container.addEventListener('dragover', e => {
                    e.preventDefault();
                    if (dragType === container.getAttribute('data-type')) {
                        container.classList.add('drag-over');
                    }
                });
                
                container.addEventListener('dragleave', () => container.classList.remove('drag-over'));
                
                container.addEventListener('drop', e => {
                    e.preventDefault();
                    container.classList.remove('drag-over');
                    
                    if (dragType !== container.getAttribute('data-type')) return;

                    const id = parseInt(e.dataTransfer.getData('text/plain'));
                    const newStatus = container.getAttribute('data-status');
                    const key = dragType === 'job' ? KEYS.jobs : KEYS.interns;
                    
                    let data = getLocal(key);
                    const idx = data.findIndex(i => i.id === id);
                    if(idx > -1) {
                        data[idx].status = newStatus;
                        setLocal(key, data);
                        renderDashboard();
                    }
                });
            });
        }

        window.handleDragStart = function(e, id, type) {
            dragSrcId = id;
            dragType = type;
            e.dataTransfer.effectAllowed = 'move';
            e.dataTransfer.setData('text/plain', id);
        };

        // 5. Render Engine
        function renderDashboard() {
            renderKanban(KEYS.jobs, 'job');
            renderKanban(KEYS.interns, 'intern');
            renderProjects();
            renderTasks();
            updateGlobalNavCounters();
        }

        function renderKanban(storageKey, type) {
            const data = getLocal(storageKey);
            const statuses = ['Applied', 'Interviewing', 'Offered', 'Rejected'];
            let counts = { Applied: 0, Interviewing: 0, Offered: 0, Rejected: 0 };

            statuses.forEach(status => {
                const container = document.querySelector(`.card-container[data-type="${type}"][data-status="${status}"]`);
                if(!container) return;
                
                container.innerHTML = '';
                const items = data.filter(i => i.status === status);
                counts[status] = items.length;

                if (items.length === 0) {
                    container.innerHTML = `<div class="empty-drop-zone">Drop Here</div>`;
                } else {
                    items.forEach(item => {
                        const avatar = item.company.charAt(0).toUpperCase();
                        const el = document.createElement('div');
                        el.className = 'exec-card';
                        el.draggable = true;
                        el.addEventListener('dragstart', (e) => handleDragStart(e, item.id, type));
                        
                        el.innerHTML = `
                            <div class="card-header">
                                <div class="card-brand">
                                    <div class="brand-avatar">${avatar}</div>
                                    <div class="card-titles">
                                        <h4>${item.company}</h4>
                                        <p>${item.role}</p>
                                    </div>
                                </div>
                                <button class="btn-icon" onclick="deleteItem('${storageKey}', ${item.id})" title="Remove Application">
                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                                </button>
                            </div>
                            <div class="card-footer">
                                <span class="micro-badge">${item.package}</span>
                                <span class="card-date">
                                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
                                    ${item.date}
                                </span>
                            </div>
                        `;
                        container.appendChild(el);
                    });
                }

                // Update Column Header Badges
                const badge = document.getElementById(`${type}-badge-${status}`);
                if(badge) badge.innerText = counts[status];
            });
        }

        function renderProjects() {
            const data = getLocal(KEYS.projects);
            const list = document.getElementById('projects-list');
            list.innerHTML = '';
            document.getElementById('count-title-projects').innerText = data.length;

            data.forEach(item => {
                const stackArray = item.stack.split(',').map(s => s.trim()).filter(s => s);
                const stackHTML = stackArray.map(tech => `<span class="stack-tag">${tech}</span>`).join('');
                
                const el = document.createElement('article');
                el.className = 'project-card';
                el.innerHTML = `
                    <div class="project-top">
                        <div>
                            <h4 class="project-title">${item.name}</h4>
                            <div class="project-meta">Updated: ${item.updated}</div>
                        </div>
                        <div class="status-pill ${item.status}">${item.status}</div>
                    </div>
                    <div class="tech-stack-row">
                        <div class="stack-tags">${stackHTML}</div>
                        <button class="btn-icon" onclick="deleteItem('${KEYS.projects}', ${item.id})" title="Remove Project">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                        </button>
                    </div>
                `;
                list.appendChild(el);
            });
        }

        function renderTasks() {
            const data = getLocal(KEYS.tasks);
            const list = document.getElementById('tasks-list');
            list.innerHTML = '';
            
            const pending = data.filter(t => !t.checked).length;
            document.getElementById('count-title-tasks').innerText = `${pending} Remaining`;

            data.forEach(item => {
                const el = document.createElement('div');
                el.className = 'task-row';
                el.innerHTML = `
                    <div class="task-left">
                        <div class="custom-check ${item.checked ? 'checked' : ''}" onclick="toggleTask(${item.id})"></div>
                        <div class="task-details">
                            <div class="task-name ${item.checked ? 'checked' : ''}">${item.name}</div>
                            <div class="task-meta-chips">
                                <span class="chip">
                                    <div class="pri-dot pri-${item.priority}"></div> 
                                    ${item.priority.charAt(0).toUpperCase() + item.priority.slice(1)}
                                </span>
                                <span class="chip">
                                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
                                    ${item.deadline}
                                </span>
                            </div>
                        </div>
                    </div>
                    <button class="btn-icon" onclick="deleteItem('${KEYS.tasks}', ${item.id})" title="Delete Task">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                    </button>
                `;
                list.appendChild(el);
            });
        }

        function updateGlobalNavCounters() {
            document.getElementById('count-nav-jobs').innerText = getLocal(KEYS.jobs).length;
            document.getElementById('count-nav-interns').innerText = getLocal(KEYS.interns).length;
            document.getElementById('count-nav-projects').innerText = getLocal(KEYS.projects).length + getLocal(KEYS.tasks).filter(t => !t.checked).length;
        }

        // 6. Utility Functions
        function getLocal(key) { return JSON.parse(localStorage.getItem(key)) || []; }
        function setLocal(key, data) { localStorage.setItem(key, JSON.stringify(data)); }

        window.deleteItem = function(key, id) {
            let data = getLocal(key).filter(i => i.id !== id);
            setLocal(key, data);
            renderDashboard();
        };

        window.toggleTask = function(id) {
            let data = getLocal(KEYS.tasks);
            let item = data.find(i => i.id === id);
            if(item) {
                item.checked = !item.checked;
                setLocal(KEYS.tasks, data);
                renderDashboard();
            }
        };

    </script>
</body>
</html>
